[project]
name = "hime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "pyarrow>=15"]

[project.optional-dependencies]
embed = ["torch>=2.4", "timm>=1.0.9", "transformers>=4.56", "pillow>=10", "huggingface_hub>=0.25"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "scikit-learn>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
